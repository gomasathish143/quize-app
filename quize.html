<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quize Game</title>
    <script src="quize.js" defer></script>     
</head>
<style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body{
    background-color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 1rem;
    font-family: sans-serif;
}
.container{
    background-color:aliceblue;
    border-radius: 1rem;
    box-shadow: 0 10px 30px rgb(29, 28, 28);
    width: 100%;
    max-width: 600px;
    overflow: hidden;
    position: relative;
}
.screen{
    display: none;
    padding: 2rem;
    text-align: center;

}
.screen.active{
    display: block;
}
#start-screen h1{
    color:#e86a33;
    margin-bottom: 20px;
    font-size: 2.5rem;
}
.quiz-header{
    margin-bottom: 2rem;
}
#question-text{
    color: black;
    font-size: 1.5rem;
    margin-bottom: 1rem;
    line-height: 1.4;
}
.quiz-info{
    display: flex;
    justify-content: space-between;
    color: grey;
    margin-bottom: 10px;
}
.answers-container{
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 25px;
}
.answer-btn{
    background-color: aliceblue;
    color: #333;
    border: 2px solid #eadbc8;
    border-radius: 10px;
    padding: 1rem;
    cursor: pointer;
    text-align: left;
    transition: all 0.3s ease;
}
.answer-btn:hover{
    background-color: #eadbc8;
    border-color: #dac0ae;
}
.answer-btn.correct{
    background-color: rgb(150, 194, 150);
    border-color: rgb(57, 131, 57);
    color:green;
}
.answer-btn.incorrect{
    background-color: rgb(197, 98, 98);
    border-color: rgb(214, 59, 59);
    color: red;
}
.progress-bar{
    height: 10px;
    background-color: #eadbc8;
    border-radius: 5px;
    overflow: hidden;
    margin-top: 20px;
}
.progress{
    height: 100%;
    background-color: #e86a33;
    width: 0%;
    transition: width 0.3s ease;
}
#result-screen h1{
    color:#e86a33;
    margin-bottom: 30px;
}
.result-info{
    background-color: #eadbc8;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 30px;
}
.result-info p{
font-size: 1.2rem;
color: #333;
margin-bottom: 1rem;
}
#result-message{
    font-size: 1.5rem;
    font-weight: 600;
    color: #e86a33;
}
button{
    background-color: #e86a33;
    color: white;
    border: none;
    border-radius: 10px;
    padding: 15px 30px;
    margin-top: 15px;
    font-size: 1.1rem;
    cursor: pointer;
    transition: background-color 0.3s ease;
}
button:hover{
    background-color: #d45b28;
}
@media (max-width:500px){
    .screen{
        padding: 1rem;
    }
    #start-screen h1{
        font-size: 2rem;
    }
    #question-text{
        font-size: 1.3rem;
    }
    .answer-btn{
        padding: 12px;
    }
    button{
        padding: 12px 25px;
        font-size: 1rem;
    }
}
</style>
<body>
    <div class="container">
        <div class="screen active" id="start-screen">
            <h1>Quiz Time !</h1>
            <p>Test your knowledge with these fun questions</p>
            <button id="start-btn">Start Quiz</button>
        </div>
        <div class="screen"id="quiz-screen">
            <div class="quiz-header">
                <h2 id="question-text">Question goes here</h2>
                <div class="quiz-info">
                    <p>Question <span id="current-question"> 1 </span> of <span id="total-questions"> 5 </span></p>
                    <p>Score:<span id="score"> 0 </span></p>
                </div>
            </div>
            <div id="answers-container"class="answers-container"></div>
            <div class="progress-bar">
                <div id="progress"class="progress"></div>
            </div>
        </div>
        <div id="result-screen"class="screen">
            <h1>Quiz Results</h1>
            <div class="result-info">
                <p>You scored <span id="final-score"> 0 </span> out of <span id="max-score"> 5 </span></p>
            <div id="result-message">Good Job!</div>
</div>
<button id="restart-btn">Restart Quiz</button>
</div>

        </div>

</body>
</html>
