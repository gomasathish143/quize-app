 <html lang="en">
 <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
 </head>
 <body>
    <script>

    const trainBook=new Promise((resolve,reject)=>{
        let bookingSuccess=false ;
        if(bookingSuccess)
            resolve();
            else
                reject();
            });
            trainBook.then(success).catch(failure);
            function success(){
                document.write("Thanks dude!")
            }
            function failure(){
                document.write("Try again....")
            }
            +"<br>"
            
            function tossCoin(){
                return new Promise((resolve,reject)=>{
                    const rand=Math.floor(Math.random()*2);
                    if(rand===0){
                        resolve();
                    }else{
                        reject();
                    }
                });
            }
            tossCoin()
            .then(()=>document.write("you won the toss!"))
            .catch(()=>document.write("sorry,you lost the toss"));
        
    
    </script>
